# AudDent marketing site — production nginx.
#
# Mirrors the security headers from `productionHeaders` in vite.config.ts so
# the container serves the same policy as `vite preview` (FOLLOWUPS.md #5b).
# Non-root: the container user is `nginx` (see the Dockerfile) — unprivileged
# port 8080, pid in /tmp, logs to the docker stream, temp files under
# /var/cache/nginx (chowned nginx in the image).
#
# Prerendered static site: every route resolves to a real file, so no SPA
# rewrite rule; unknown paths get the custom 404 with a real 404 status.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;

  # Lead-form abuse control (FOLLOWUPS.md #4): per-client-IP rate limit for
  # the reserved lead endpoint. The site is fully static today, so the
  # location answers 404; when the real lead backend lands, serve it here
  # and keep the limit_req line so abuse protection is live from request one.
  limit_req_zone $binary_remote_addr zone=lead:10m rate=10r/m;
  limit_req_status 429;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_types text/css text/plain text/xml application/javascript application/json application/rss+xml application/xml image/svg+xml;

  server {
    listen 8080;
    server_name _;
    # Relative Location on redirects (301 /resources -> /resources/): the
    # browser resolves it against its own origin, so it is correct behind
    # port mappings and TLS-terminating edges alike.
    absolute_redirect off;

    root /usr/share/nginx/html;

    include /etc/nginx/snippets/security-headers.conf;

    error_page 404 /404.html;

    # Reserved lead endpoint: rate-limited stub until the backend exists
    # (FOLLOWUPS.md #4). Bursts beyond 10r/m answer 429 (limit_req_status).
    location = /api/leads {
      limit_req zone=lead burst=5 nodelay;
      return 404;
    }

    location / {
      try_files $uri $uri/ =404;
    }

    # Hashed build assets: the URL changes on every content change.
    location /assets/ {
      expires 1y;
    }

    # HTML: revalidate on every load (content changes per deploy).
    location ~* \.html$ {
      expires -1;
    }
  }
}
