# Security headers — must stay in lockstep with `productionHeaders` in
# vite.config.ts (FOLLOWUPS.md #5b). `always` applies them to every response
# (including the custom 404). HSTS is safe to send before the public edge has
# TLS: browsers ignore it over plain http, and the edge (DigitalOcean)
# terminates TLS.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://plausible.io; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://plausible.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
