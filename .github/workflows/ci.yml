# CI for the standalone AudDent site. The full quality gate runs on every
# push to a long-lived branch and on every PR — the check `gate` is what
# branch protection requires before a merge.
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # typecheck + lint + unit + linkrot + build/prerender + e2e
      - name: Gate
        run: npm run gate
