<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | AudDent</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b2545" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f8fc;
        color: #1f2d3d;
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        padding: 24px;
      }

      main {
        max-width: 480px;
        text-align: center;
      }

      .code {
        margin: 0;
        font-size: 84px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.03em;
        color: #0a63c9;
      }

      h1 {
        margin: 18px 0 10px;
        font-size: 24px;
        font-weight: 800;
        color: #0b2545;
      }

      p.body {
        margin: 0 0 26px;
        font-size: 15.5px;
        line-height: 1.65;
        color: #52606d;
      }

      a.back {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        font-weight: 600;
        line-height: 1;
        border-radius: 10px;
        padding: 13px 22px;
        text-decoration: none;
        background: #0a63c9;
        color: #ffffff;
        box-shadow: 0 2px 6px rgba(10, 99, 201, 0.35);
        transition:
          background-color 0.15s ease,
          box-shadow 0.15s ease;
      }

      a.back:hover {
        background: #0852a3;
        box-shadow: 0 4px 12px rgba(10, 99, 201, 0.45);
      }

      a.back:focus-visible {
        outline: 3px solid rgba(10, 99, 201, 0.45);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>This page doesn’t exist.</h1>
      <p class="body">
        The link may be old or mistyped — everything you need is on the home page.
      </p>
      <a class="back" href="/">Back to AudDent</a>
    </main>
  </body>
</html>
